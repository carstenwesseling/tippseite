<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tippspiel – Spiele hinter den Punkten, Vorschlag B: Spielfeld</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="spieltag-base.css">
<style>
/* Vorschlag B "Spielfeld": grüner Rasen, jedes Spiel eine Karte mit Anzeigetafel (echtes Ergebnis) und Tippschein (Tipp).
   Exakter Tipp = gelbe Karte, richtige Tendenz = weiße Karte, daneben = nichts. */
:root { --g-bg: #17653a; --g-row: #1d7345; --g-ink: #f6faf6; --g-muted: #b5d6c1; --g-line: #ffffff2e; --board: #0b1a11; --led: #ffd84a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --g-bg: #0e2418; --g-row: #133021; --g-muted: #8db39c; --g-line: #ffffff22; } }
:root[data-theme="dark"] { --g-bg: #0e2418; --g-row: #133021; --g-muted: #8db39c; --g-line: #ffffff22; }
body.detail-open { background: var(--g-bg); }
body.detail-open .bar, body.detail-open .vs { }
.pitch { background:
  repeating-linear-gradient(90deg, #ffffff08 0 64px, transparent 64px 128px), var(--g-bg);
  color: var(--g-ink); min-height: calc(100dvh - 90px); margin: -12px 0 -40px; padding-block: 14px 48px; }
.pg { max-width: 900px; margin: 0 auto; }
.back { display: inline-flex; padding: 6px 0; font-weight: 500; font-size: 14px; color: var(--g-muted); } .back:hover { color: var(--g-ink); }
.top { display: grid; gap: 10px; padding: 10px 0 14px; }
.who { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.who h2 { margin: 0; font: 700 32px/1 var(--display); text-transform: uppercase; letter-spacing: .01em; overflow-wrap: anywhere; }
.yc { display: inline-block; width: 17px; height: 23px; border-radius: 3px; background: var(--card); box-shadow: 0 1px 2px #0005; transform: rotate(-6deg); flex: none; }
.sub { color: var(--g-muted); font-size: 14px; }
.board { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4px 16px; background: var(--board); border: 2px solid #ffffff30; border-radius: 10px; padding: 12px 16px; box-shadow: 0 6px 18px #0004; }
.board .v { font: 700 56px/.9 var(--display); color: var(--led); letter-spacing: .04em; text-shadow: 0 0 12px #ffd84a55; grid-row: span 2; min-width: 1.3ch; text-align: center; }
.board .u { font: 600 12px/1 var(--text); letter-spacing: .1em; text-transform: uppercase; color: var(--led); opacity: .8; align-self: end; }
.board .f { color: #d8e8de; font-size: 14px; font-variant-numeric: tabular-nums; align-self: start; }
.ctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; background: #00000026; border: 1px solid var(--g-line); border-radius: 8px; padding: 2px; }
.seg a { padding: 5px 11px; border-radius: 6px; font-weight: 500; font-size: 13px; color: var(--g-muted); }
.seg a b { margin-left: 5px; font-weight: 600; }
.seg a[aria-current] { background: var(--g-ink); color: #0b3d21; }
.tgl { margin-left: auto; display: inline-flex; gap: 7px; align-items: center; font-size: 13px; color: var(--g-muted); }
.tgl i { width: 30px; height: 18px; border-radius: 9px; background: #ffffff33; position: relative; }
.tgl i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
.tgl[aria-pressed="true"] i { background: var(--led); } .tgl[aria-pressed="true"] i::after { transform: translateX(12px); background: #000; }

.dh { display: flex; align-items: baseline; justify-content: space-between; margin: 20px 0 8px; border-bottom: 1px solid var(--g-line); padding-bottom: 4px; }
.dh a { font: 700 21px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; } .dh a:hover { text-decoration: underline; }
.dh span { color: var(--g-muted); font-size: 13px; } .dh span b { color: var(--g-ink); font-size: 16px; }
.cards { display: grid; gap: 8px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .cards { grid-template-columns: 1fr 1fr; gap: 10px; } }
.k { position: relative; background: var(--g-row); border: 1px solid var(--g-line); border-radius: 10px; padding: 10px 12px 10px; display: grid; gap: 8px; }
.k.p0 { background: transparent; border-style: dashed; opacity: .78; }
.teams { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; font-weight: 600; font-size: 14.5px; }
.teams .h { text-align: right; } .teams .a { text-align: left; }
.sc { background: var(--board); color: var(--led); font: 700 24px/1 var(--display); letter-spacing: .08em; padding: 5px 10px; border-radius: 5px; border: 1px solid #ffffff2a; font-variant-numeric: tabular-nums; text-shadow: 0 0 8px #ffd84a44; }
.ticket { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #f7faf4; color: #101a14; border-radius: 6px; padding: 5px 10px; font-size: 13px; position: relative; font-variant-numeric: tabular-nums;
  -webkit-mask: radial-gradient(circle 5px at 0 50%, transparent 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 5px at 100% 50%, transparent 98%, #000) right / 51% 100% no-repeat; mask: radial-gradient(circle 5px at 0 50%, transparent 98%, #000) left / 51% 100% no-repeat, radial-gradient(circle 5px at 100% 50%, transparent 98%, #000) right / 51% 100% no-repeat; }
.ticket em { font-style: normal; color: #5d6b62; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.ticket b { font: 700 19px/1 var(--display); letter-spacing: .06em; margin-left: 6px; }
.ticket .t { display: flex; align-items: baseline; }
.ticket .r { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 12.5px; }
.card { width: 12px; height: 17px; border-radius: 2px; flex: none; box-shadow: 0 1px 2px #0004; }
.card.y { background: var(--card); } .card.w { background: #fff; box-shadow: inset 0 0 0 1.5px #5d6b62; } .card.n { background: transparent; box-shadow: inset 0 0 0 1.5px #b9c4bd; }
.p2 .ticket { background: #fff6c2; } 
.more { margin-top: 6px; font-size: 12.5px; color: var(--g-muted); }
.pn { display: flex; justify-content: space-between; gap: 8px; margin-top: 26px; font-size: 14px; font-weight: 500; }
.pn a { padding: 8px 12px; border: 1px solid var(--g-line); background: #00000026; border-radius: 8px; } .pn a:hover { background: #00000040; }
.pn .na { visibility: hidden; } .pn .lbl { align-self: center; color: var(--g-muted); font-size: 12.5px; }
</style>
</head>
<body>
<header class="bar"><div class="gut"><div class="bar-in">
  <a class="brand" href="index.html"><i></i>Tippspiel</a>
  <nav><a href="#/" aria-current="page">Halbserien</a><a href="#/">Bestenliste</a><a href="#/">Tippen</a></nav>
  <span class="avatar">CW</span>
</div></div></header>
<div class="vs"><div class="gut"><span>Vorschlag:</span><a href="spieltag-a.html">A Anstoß</a><a href="spieltag-b.html" aria-current="page">B Spielfeld</a><a href="spieltag-c.html">C Matchday</a><a href="index.html">← alle Entwürfe</a></div></div>
<main>
  <section id="tablesec">
    <div class="gut head"><div><h1>Rückrunde 25/26</h1><div class="meta" id="roundmeta"></div></div></div>
    <div class="wrap" tabindex="0" aria-label="Tabelle, seitlich scrollbar"></div>
    <div class="gut hint"><span><b>Auf eine Zahl tippen</b> zeigt die Spiele dahinter: Tipp und echtes Ergebnis.</span><span>Name = alle Spiele des Spielers.</span></div>
  </section>
  <section id="detail" hidden></section>
</main>
<script>
window.SB_UI = {
  mode: 'page',
  render(c) {
    const { esc, sc } = window.SB;
    const card = (r) => `<div class="k p${r.pts}"><div class="teams"><span class="h">${esc(r.m.home)}</span><span class="sc" aria-label="Ergebnis ${sc(r.res)}">${sc(r.res)}</span><span class="a">${esc(r.m.away)}</span></div>
      <div class="ticket"><span class="t"><em>Tipp</em><b>${sc(r.tip)}</b></span>
        <span class="r"><i class="card ${r.pts === 2 ? 'y' : r.pts === 1 ? 'w' : 'n'}" aria-hidden="true"></i>${r.pts === 2 ? '2 Pkt · exakt' : r.pts === 1 ? '1 Pkt · Tendenz' : '0 Pkt'}</span></div></div>`;
    const grp = (g) => `<div class="dh"><a href="${SB.href(c.name, 'd' + g.day)}">Spieltag ${g.day}</a><span>${g.best && c.ty !== 'd' ? '★ Tagesbester · ' : ''}<b>${g.sum}</b> Pkt</span></div>
      <div class="cards">${g.rows.map(card).join('')}</div>${g.hidden ? `<div class="more">+ ${g.hidden} ${g.hidden === 1 ? 'Spiel' : 'Spiele'} ohne Punkte</div>` : ''}`;
    const nav = (x, dir) => x ? `<a href="${x.href}">${dir < 0 ? '← ' : ''}${esc(x.name ?? 'Spieltag ' + x.day)}${dir > 0 ? ' →' : ''}</a>` : `<a class="na" aria-hidden="true">–</a>`;
    return `<div class="pitch gut"><div class="pg"><a class="back" href="#/" data-act="close">← Zur Tabelle</a>
      <div class="top"><div class="who"><h2>${esc(c.name)}</h2>${c.isBest ? '<i class="yc" title="Tagesbester" aria-hidden="true"></i>' : ''}<span class="sub">Platz ${c.p.rank} · ${esc(c.label)}${c.isBest ? ' · Tagesbester' : ''}</span></div>
        <div class="board"><div class="v">${c.value}</div><div class="u">${c.unit}</div><div class="f">${c.formula}${c.ty === 'total' || c.ty === 'd' ? ` · ${c.cnt.n} ohne Punkte` : ''}</div></div>
        <div class="ctl"><div class="seg" aria-label="Wert wählen">${c.tabs.map((t) => `<a href="${t.href}" ${t.active ? 'aria-current="true"' : ''}>${t.label}<b>${t.n}</b></a>`).join('')}</div>
          ${c.canToggle ? `<button class="tgl" data-act="only" aria-pressed="${c.only}"><i></i>nur Treffer</button>` : ''}</div></div>
      ${c.groups.map(grp).join('')}
      <div class="pn">${nav(c.prevP, -1)}<span class="lbl">Spieler</span>${nav(c.nextP, 1)}</div>
      ${c.dayNo ? `<div class="pn" style="margin-top:8px">${nav(c.prevD, -1)}<span class="lbl">Spieltag</span>${nav(c.nextD, 1)}</div>` : ''}
    </div></div>`;
  },
};
</script>
<script src="spieltag.js"></script>
</body>
</html>
