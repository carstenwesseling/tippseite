<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tippspiel – Vorschlag B: Spielfeld</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="tippen-base.css">
<link rel="stylesheet" href="tippen.css">
<style>
/* Vorschlag B "Spielfeld": grüne Rasenfläche, Tippfelder wie Anzeigetafeln. Name + Fortschritt kleben oben; ein vollständiger Spieltag bekommt die gelbe Karte. */
.tp-b { --surface: var(--g-bg); --ink: var(--g-ink); --muted: var(--g-muted); --line: var(--g-line); --pitch: var(--g-on); background: var(--g-bg); color: var(--g-ink); min-height: calc(100dvh - 140px); }
.tp-b .topbox { position: sticky; top: calc(49px + env(safe-area-inset-top, 0px)); z-index: 10; background: var(--g-row); border-bottom: 1px solid var(--g-line); display: grid; gap: 6px; padding-block: 8px; }
@media (min-width: 640px) { .tp-b .topbox { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: center; } }
.tp-b .who select { background: #fff; color: #101a14; border-color: transparent; }
.tp-b .mlink { color: var(--g-muted); }
.tp-b .pbar { background: #ffffff33; } .tp-b .pbar i { background: #fff; }
.tp-b .pnum b { color: #fff; }
.tp-b .send { background: var(--card); color: var(--card-ink); border-color: var(--card); height: 36px; }
.tp-b .chips { display: none; }
.tp-b .need { color: #fff; font-weight: 500; }
.tp-b .dh { display: flex; align-items: center; justify-content: space-between; margin: 0; padding-block: 18px 6px; font: 700 28px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.tp-b .cnt { color: var(--g-muted); font-size: 13px; }
.tp-b .full .cnt { color: var(--card-ink); background: var(--card); padding: 5px 7px; border-radius: 3px; transform: rotate(-3deg); }
.tp-b .ms { margin-inline: max(16px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--g-line); }
.tp-b .m { display: grid; grid-template-columns: minmax(0, 1fr) 46px 8px 46px minmax(0, 1fr); align-items: center; gap: 0 6px; min-height: 56px; border-bottom: 1px solid var(--g-line); }
.tp-b .t { font: 600 17px/1.1 var(--text); }
.tp-b .t.h { text-align: right; }
.tp-b .col { text-align: center; color: var(--g-muted); font-weight: 700; }
.tp-b .tip { background: #fff; color: #101a14; border: 0; height: 40px; width: 46px; border-radius: 4px; font-size: 26px; box-shadow: 0 2px 0 #00000040; }
.tp-b .tip:focus { box-shadow: 0 0 0 3px var(--card); }
.tp-b .endsend { display: block; }
.tp-b .big { background: var(--card); color: var(--card-ink); border-color: var(--card); }
@media (min-width: 760px) { .tp-b { max-width: 760px; margin: 0 auto; border-radius: 6px; } }

</style>
</head>
<body>
<header class="bar"><div class="gut"><div class="bar-in">
  <a class="brand" href="index.html"><i></i>Tippspiel</a>
  <nav><a href="index.html">Halbserien</a><a href="tippen-b.html" aria-current="page">Tippen</a><a href="tippen-mitglieder.html">Verwaltung</a></nav>
  <span class="avatar">CW</span>
</div></div></header>
<main>
  <h1 class="gut" style="margin-inline:0">Rückrunde 26/27 tippen</h1>
  <div id="app"></div>
</main>
<script src="tippen.js"></script>
<script>Tippen.mount({ root: document.getElementById('app'), variant: 'b', layout: { top: ['who', 'prog'], dock: [] } });</script>
</body>
</html>
